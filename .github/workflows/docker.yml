name: Build and publish container to GHCR

on:
  push:
    branches: [deploy-sean]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and run focused API tests
        run: |
          dotnet build prjGoHike/prjGoHike.csproj --configuration Release
          dotnet run --project tests/GoHikeSafeApiTests --configuration Release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish on deploy-sean
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}:{1}', steps.image.outputs.name, github.sha) || 'gohike:pr' }}
