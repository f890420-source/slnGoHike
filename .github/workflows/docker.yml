name: Build and deploy container

on:
  push:
    branches: [deploy-sean]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and run focused API tests
        run: |
          dotnet build prjGoHike/prjGoHike.csproj --configuration Release
          dotnet run --project tests/GoHikeSafeApiTests --configuration Release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Azure using GitHub OIDC
        if: github.event_name == 'push'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: github.event_name == 'push'
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Build image and push on deploy-sean
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}.azurecr.io/gohike:{1}', vars.AZURE_ACR_NAME, github.sha) || 'gohike:pr' }}

      - name: Deploy the immutable image to Container Apps
        if: github.event_name == 'push'
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/gohike:$GITHUB_SHA"
